<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Integra Escolar | Cadastro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/paleta.css">
  <link rel="stylesheet" href="assets/css/cadastro.css">
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="bg-light bg-light-1"></div>
  <div class="bg-light bg-light-2"></div>

  <main class="page">
    <header class="logo-container">
      <div class="logo-icon">
        <a href="index.html" aria-label="Voltar para o login">
          <img src="assets/img/logo-tela-inicio.png" alt="Logo Integra Escolar">
        </a>
      </div>
    </header>

    <section class="cadastro-card">
      <div class="card-border"></div>
      <div class="card-content">
        <h1 class="login-title">CADASTRO</h1>
        <p class="subtitle">Cadastre o responsável e vincule-o ao aluno pela matrícula escolar.</p>

        <form id="cadastroForm">
          <div class="grid">
            <div class="coluna">
              <div class="input-group">
                <label for="nome">Nome completo</label>
                <div class="input-wrapper">
                  <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" /></svg>
                  <input type="text" id="nome" placeholder="Digite seu nome" autocomplete="name" required>
                </div>
              </div>

              <div class="input-group">
                <label for="cpf">CPF</label>
                <div class="input-wrapper">
                  <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15 9h3.75M15 12h3.75M15 15h3.75M4.5 19.5h15a2.25 2.25 0 0 0 2.25-2.25V6.75A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25v10.5A2.25 2.25 0 0 0 4.5 19.5Zm6-10.125a1.875 1.875 0 1 1-3.75 0 1.875 1.875 0 0 1 3.75 0Zm1.294 6.336a6.721 6.721 0 0 1-3.17.789 6.721 6.721 0 0 1-3.168-.789 3.376 3.376 0 0 1 6.338 0Z" /></svg>
                  <input type="text" id="cpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="14" required>
                </div>
              </div>

              <div class="input-group">
                <label for="telefone">Telefone</label>
                <div class="input-wrapper">
                  <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 0 1-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25Z" /></svg>
                  <input type="text" id="telefone" placeholder="(00) 00000-0000" inputmode="tel" maxlength="15" required>
                </div>
              </div>

              <div class="input-group">
                <label for="matricula">Matrícula do aluno</label>
                <div class="input-wrapper">
                  <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 4.5h16.5v15H3.75v-15Zm3 3h10.5M6.75 12h4.5m-4.5 3h7.5" /></svg>
                  <input type="text" id="matricula" placeholder="Digite a matrícula" inputmode="numeric" required>
                </div>
              </div>
            </div>

            <div class="divisoria"></div>

            <div class="coluna">
              <div class="input-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                  <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25H4.5a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5H4.5A2.25 2.25 0 0 0 2.25 6.75m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.909A2.25 2.25 0 0 1 2.25 6.993V6.75" /></svg>
                  <input type="email" id="email" placeholder="Digite seu email" autocomplete="email" required>
                </div>
              </div>

              <div class="input-group">
                <label for="senha">Senha</label>
                <div class="input-wrapper">
                  <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 0h10.5A2.25 2.25 0 0 1 19.5 12.75v6A2.25 2.25 0 0 1 17.25 21h-10.5A2.25 2.25 0 0 1 4.5 18.75v-6A2.25 2.25 0 0 1 6.75 10.5Z" /></svg>
                  <input type="password" id="senha" placeholder="Mínimo de 6 caracteres" autocomplete="new-password" minlength="6" required>
                  <button type="button" class="toggle-password" aria-label="Mostrar ou ocultar senha"><img src="assets/img/OLHO-FECHADO.png" class="eyeIcon" alt=""></button>
                </div>
              </div>

              <div class="input-group">
                <label for="confirmar">Confirmar senha</label>
                <div class="input-wrapper">
                  <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 0h10.5A2.25 2.25 0 0 1 19.5 12.75v6A2.25 2.25 0 0 1 17.25 21h-10.5A2.25 2.25 0 0 1 4.5 18.75v-6A2.25 2.25 0 0 1 6.75 10.5Z" /></svg>
                  <input type="password" id="confirmar" placeholder="Digite a senha novamente" autocomplete="new-password" minlength="6" required>
                  <button type="button" class="toggle-password" aria-label="Mostrar ou ocultar senha"><img src="assets/img/OLHO-FECHADO.png" class="eyeIcon" alt=""></button>
                </div>
              </div>

              <div id="mensagemCadastro" class="mensagem-cadastro" role="status" aria-live="polite"></div>
            </div>
          </div>

          <button type="submit" class="login-button">
            <span>CADASTRAR</span>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12 13.5 0m0 0-5.25-5.25M18 12l-5.25 5.25" /></svg>
          </button>
          <p class="voltar-login">Já possui cadastro? <a href="index.html">Entrar no sistema</a></p>
        </form>
      </div>
    </section>
  </main>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/cadastro.js"></script>
</body>
</html>
