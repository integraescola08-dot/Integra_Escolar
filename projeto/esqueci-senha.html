<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Integra Escolar | Esqueci minha senha</title>
  <link rel="icon" type="image/png" href="../assets/img/Logo casinha- endereço.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/paleta.css">
  <link rel="stylesheet" href="assets/css/login.css">
  <link rel="stylesheet" href="assets/css/esqueci-senha.css">
</head>
<body>

  <div class="bg-gradient"></div>
  <div class="bg-light bg-light-1"></div>
  <div class="bg-light bg-light-2"></div>

  <main class="page">

    <!-- LOGO -->
    <header class="logo-container">
      <div class="logo-icon">
        <a href="index.html" aria-label="Voltar para o login">
          <img src="assets/img/logo-tela-inicio.png" alt="Logo Integra Escolar">
        </a>
      </div>
    </header>

    <!-- CARD -->
    <section class="login-card recuperar-card">
      <div class="card-border"></div>

      <div class="card-content">

        <p class="login-mini-title">SENHA ESQUECIDA</p>

        <p class="login-subtitle">Por segurança, a senha não pode ser redefinida diretamente pelo site.</p>

        <div class="recuperar-icone">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1 1 21.75 8.25Z" />
          </svg>
        </div>

        <p class="recuperar-texto">
          Para recuperar o acesso à sua conta, entre em contato com o <strong>administrador do sistema</strong> da escola.
          Ele irá localizar o cadastro do responsável e informar a senha de acesso.
        </p>

        <a href="index.html" class="login-button">
          <span>VOLTAR PARA O LOGIN</span>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12 13.5 0m0 0-5.25-5.25M18 12l-5.25 5.25" />
          </svg>
        </a>

      </div>
    </section>

  </main>

  <script src="assets/js/api.js"></script>
</body>
</html>
