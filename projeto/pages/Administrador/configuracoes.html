<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" type="image/png" href="/assets/img/casa-simbolo.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configurações — Integra Escolar</title>
  <link rel="stylesheet" href="../../assets/css/paleta.css">
  <link rel="stylesheet" href="../../assets/css/admin.css">
  <link rel="stylesheet" href="../../assets/css/configuracoes-gerais.css">
</head>
<body>

<!-- ═══ HEADER DO ADMIN ═══ -->
<header>
  <div class="titulo">
    <strong>Integra Escolar</strong>
    <span>Administração</span>
  </div>
  <button id="logout">Sair</button>
</header>

<!-- ═══ CONTEÚDO CENTRALIZADO ═══ -->
<main style="padding: 40px 20px; display: flex; justify-content: center;">
  <div class="page" style="max-width: 950px; width: 100%;">
    <div class="card">

      <!-- ══ TELA PRINCIPAL ══ -->
      <div id="screen-main" class="screen active">
        <div class="main-header">
          <button class="btn-back" onclick="window.location.href='admin-index.html'" title="Voltar para o painel">
            <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
          </button>
          <h2 style="margin-left: 12px;">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            Configurações
          </h2>
          <div class="user-card">
            <div class="user-avatar" id="header-avatar">···</div>
            <div class="user-info">
              <div class="user-name"  id="header-name">Carregando...</div>
              <div class="user-email" id="header-email"></div>
              <div class="user-role-badge">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                <span id="header-role-label">Administrador</span>
              </div>
            </div>
            <button class="btn-edit-profile" onclick="goTo('screen-perfil')">Editar</button>
          </div>
        </div>

        <div class="menu-body">
          <div>
            <p class="menu-group-label">Conta</p>
            <div class="menu-list">
              <button class="menu-item" onclick="goTo('screen-perfil')">
                <span class="menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></span>
                <span class="menu-item-text"><span class="menu-item-label">  Informações do Perfil</span><span class="menu-item-desc">Nome, e-mail, telefone e foto</span></span>
                <span class="menu-chevron"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span>
              </button>
              <button class="menu-item" onclick="goTo('screen-seguranca')">
                <span class="menu-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
                <span class="menu-item-text"><span class="menu-item-label">  Segurança</span><span class="menu-item-desc">Alterar senha</span></span>
                <span class="menu-chevron"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span>
              </button>
            </div>
          </div>
          <div>
            <p class="menu-group-label">Zona de Perigo</p>
            <div class="menu-list">
              <button class="menu-item danger" onclick="sairDaConta()">
                <span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>
                <span class="menu-item-text"><span class="menu-item-label">Sair da conta</span></span>
              </button>
            </div>
          </div>
          <p class="version-text">Integra Escolar v1.0.0</p>
        </div>
      </div>

      <!-- ══ TELA PERFIL ══ -->
      <div id="screen-perfil" class="screen">
        <div class="section-header">
          <button class="btn-back" onclick="goTo('screen-main')"><svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></button>
          <h2>Informações do Perfil</h2>
        </div>
        <div class="form-body">
          <div class="avatar-section">
            <div class="avatar-lg" id="perfil-avatar-display">
              <div class="avatar-lg-inner">
                <span id="perfil-avatar-initials">···</span>
                <img id="perfil-avatar-img" src="" alt="" style="display:none" />
              </div>
              <label class="avatar-camera-btn" title="Alterar foto">
                <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                <input type="file" accept="image/*" id="avatar-input" style="display:none" onchange="handleAvatarChange(event)" />
              </label>
            </div>
            <p class="avatar-hint">Clique no ícone da câmera para alterar a foto</p>
            <button class="btn-remove-photo" id="btn-remove-photo" style="display:none" onclick="removeAvatar()">Remover foto</button>
          </div>
          <div class="field"><label>Nome completo</label><input type="text" id="input-nome" placeholder="Seu nome completo" maxlength="150" oninput="syncHeader()" /></div>
          <div class="field"><label>E-mail</label><input type="email" id="input-email" placeholder="seu.email@exemplo.com" oninput="syncHeader()" /></div>
          <button class="btn-save" onclick="savePerfil()"><svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>Salvar alterações</button>
        </div>
      </div>

      <!-- ══ TELA SEGURANÇA ══ -->
      <div id="screen-seguranca" class="screen">
        <div class="section-header">
          <button class="btn-back" onclick="goTo('screen-main')"><svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></button>
          <h2>Segurança</h2>
        </div>
        <div class="form-body">
          <div class="info-box"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>A senha deve ter no mínimo 6 caracteres, com letras e números.</span></div>
          <div class="field"><label>Senha atual</label><div class="password-wrap"><input type="password" id="senha-atual" placeholder="••••••••" /><button class="toggle-pass" onclick="togglePass('senha-atual',this)" type="button"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
          <div class="field"><label>Nova senha</label><div class="password-wrap"><input type="password" id="senha-nova" placeholder="••••••••" oninput="checkPasswordMatch()" /><button class="toggle-pass" onclick="togglePass('senha-nova',this)" type="button"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
          <div class="field"><label>Confirmar nova senha</label><div class="password-wrap"><input type="password" id="senha-confirm" placeholder="••••••••" oninput="checkPasswordMatch()" /><button class="toggle-pass" onclick="togglePass('senha-confirm',this)" type="button"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
          <div id="match-indicator" style="display:none"></div>
          <button class="btn-save" onclick="saveSenha()"><svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>Alterar senha</button>
        </div>
      </div>

    </div>
  </div>
</main>

<div id="toast"></div>
<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/configuracoes-gerais.js"></script>
<script>
  // Sincronizar logout com o do admin
  document.getElementById('logout').addEventListener('click', () => {
    if(confirm('Tem certeza que deseja sair?')) {
      localStorage.removeItem('token');
      window.location.href = '../../index.html';
    }
  });

  // Funções auxiliares que podem ser chamadas pelo JS
  function goTo(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function sairDaConta() {
    if(confirm('Tem certeza que deseja sair da conta?')) {
      localStorage.removeItem('token');
      window.location.href = '../../index.html';
    }
  }
</script>
</body>
</html>
