<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" type="image/png" href="/assets/img/Logo%20casinha-%20endere%C3%A7o.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Integra Escolar | Enviar Atestado</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/paleta.css">
  <link rel="stylesheet" href="../../assets/css/header-responsavel.css">
  <link rel="stylesheet" href="../../assets/css/enviar-atestado.css">
</head>
<body>

  <!-- ── Header padrão ── -->
  <header>
    <div class="logo">
      <img src="../../assets/img/LOGO-minimalista.png" alt="Logo">
    </div>
    <div class="top-content">
      <div class="user">
        <i class="fa-regular fa-user"></i>
        <span>Responsável</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn sair-btn" onclick="sair()" title="Sair da conta" aria-label="Sair da conta">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="page-content">

    <!-- Seleção do estudante -->
    <section class="select-section">
      <h2 class="titulo-com-voltar">
        <button class="btn-voltar-inline" onclick="ir('home.html', null, 'voltar')" title="Voltar" aria-label="Voltar para a tela inicial">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        Enviar Atestado
      </h2>
      <h2>Selecionar Estudante</h2>
      <div class="campo">
        <label for="nomeEstudante">Nome do Estudante <span>*</span></label>
        <select id="nomeEstudante" required>
          <option value="" disabled selected>Carregando estudantes...</option>
        </select>
      </div>
    </section>
    <!--Seleção da Declaração-->
<section class="select-section">
      <h2>Selecionar Tipo de Declaração</h2>
      <div class="campo">
        <label for="nomeEstudante">Tipo de Declaração <span>*</span></label>
        <select id="tipoDeclaracao" required>
          <option value="" disabled selected>Selecione a declaração...</option>
          <option value="Atestado Médico">Atestado Médico</option>
          <option value="Declaração de comparecimento à consulta médica">Declaração de comparecimento à consulta médica</option>
          <option value="Declaração dos pais ou responsáveis">Declaração dos pais ou responsáveis</option>
          <option value="outros">Outros</option>
        </select>
      </div>
    </section>

    <section class="select-section">
      <h2>Período da Justificativa</h2>
      <div class="linha-datas">
        <div class="campo">
          <label for="dataInicioAtestado">Data inicial <span>*</span></label>
          <input type="date" id="dataInicioAtestado" required>
        </div>
        <div class="campo">
          <label for="dataFimAtestado">Data final <span>*</span></label>
          <input type="date" id="dataFimAtestado" required>
        </div>
      </div>
      <p class="ajuda-periodo">Informe o período coberto pelo atestado ou declaração.</p>
    </section>

    <section class="upload-section">
      <h2>Anexar Documento</h2>
      <label class="upload-box" id="uploadBox">
        <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg" hidden>
        <div class="upload-content" id="uploadContent">
          <i class="fa-solid fa-upload"></i>
          <h3>Clique para realizar upload</h3>
          <p>PDF, PNG, JPG ou JPEG (máx. 10MB)</p>
        </div>
        <div class="upload-preview" id="uploadPreview">
          <i class="fa-solid fa-file-circle-check"></i>
          <span id="fileName"></span>
          <button type="button" id="removerArquivo" title="Remover arquivo" aria-label="Remover arquivo selecionado">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </label>
    </section>

    <section class="obs-section">
      <h2 id="tituloObservacoes">Observações <span id="marcaOpcional">(opcional)</span><span id="marcaObrigatoria" style="display:none">*</span></h2>
      <textarea id="observacoesAtestado" placeholder="Adicione informações extras ao atestado..."></textarea>
    </section>

    <section class="buttons-area">
      <button class="cancel-btn" onclick="cancelarEnvio()">Cancelar</button>
      <button class="send-btn" id="btnEnviar" onclick="enviarArquivo()">Enviar</button>
    </section>

  </main>

  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/header.js"></script>
  <script src="../../assets/js/enviar-atestado.js"></script>
</body>
</html>
