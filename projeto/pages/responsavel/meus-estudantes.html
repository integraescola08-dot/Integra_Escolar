<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" type="image/png" href="/assets/img/Logo%20casinha-%20endere%C3%A7o.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meus Estudantes — Integra Escolar</title>
  <link rel="stylesheet" href="../../assets/css/paleta.css">
  <link rel="stylesheet" href="../../assets/css/meus-estudantes.css">
</head>
<body>
<div class="page">
  <div class="card">

    <!-- Cabeçalho -->
    <div class="card-header">
      <div class="card-header-top">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <h2>Meus Estudantes</h2>
      </div>
      <p class="card-header-sub">Estudantes vinculados à sua conta de responsável</p>
    </div>

    <!-- Ação: vincular novo estudante por matrícula -->
    <div class="acao-vincular">
      <button type="button" class="btn-adicionar" id="btn-abrir-vincular">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Adicionar estudante
      </button>
    </div>

    <!-- Lista -->
    <div class="lista-estudantes" id="lista">
      <div class="status-msg" id="carregando">
        <p>Carregando estudantes...</p>
      </div>
    </div>

  </div>
</div>

<!-- Modal: vincular estudante por matrícula -->
<div class="modal-fundo" id="modal-vincular" hidden>
  <div class="modal-caixa">
    <h3>Adicionar estudante</h3>
    <p class="modal-sub">Informe a matrícula do estudante para vincular à sua conta.</p>
    <form id="form-vincular">
      <label for="input-matricula">Matrícula do estudante</label>
      <input type="text" id="input-matricula" inputmode="numeric" placeholder="Digite a matrícula (6 a 12 dígitos)" minlength="6" maxlength="12" pattern="[0-9]{6,12}" required>
      <p class="modal-msg" id="modal-msg" hidden></p>
      <div class="modal-acoes">
        <button type="button" class="btn-acao secundario" id="btn-cancelar-vincular">Cancelar</button>
        <button type="submit" class="btn-acao primario" id="btn-confirmar-vincular">Vincular</button>
      </div>
    </form>
  </div>
</div>

<script src="../../assets/js/api.js"></script>
<script src="../../assets/js/meus-estudantes.js"></script>
</body>
</html>
