<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" type="image/png" href="/assets/img/Logo%20casinha-%20endere%C3%A7o.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Integra Escolar | Liberar Estudante</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/paleta.css">
  <link rel="stylesheet" href="../../assets/css/header-responsavel.css">
  <link rel="stylesheet" href="../../assets/css/liberar-estudante.css">
</head>
<body>

  <!-- ── Header padrão ── -->
  <header>
    <div class="logo">
      <img src="../../assets/img/LOGO-minimalista.png" alt="Logo">
    </div>
    <div class="top-content">
      <div class="user">
        <i class="fa-regular fa-user"></i>
        <span>Responsável</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn sair-btn" onclick="sair()" title="Sair da conta" aria-label="Sair da conta">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="container">

    <p class="page-title titulo-com-voltar">
      <button class="btn-voltar-inline" onclick="ir('home.html', null, 'voltar')" title="Voltar" aria-label="Voltar para a tela inicial">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      Liberar Estudante
    </p>

    <form id="formLiberacao">

      <div class="campo">
        <label for="estudante">Estudante <span>*</span></label>
        <select id="estudante" required>
          <option value="">Selecione o estudante</option>
          <option>João Silva</option>
          <option>Maria Oliveira</option>
          <option>Pedro Santos</option>
        </select>
      </div>

      <div class="linha">
        <div class="campo">
          <label for="dataLiberacao">Data da Liberação <span>*</span></label>
          <input type="date" id="dataLiberacao" required>
        </div>

        <div class="campo">
          <label for="horaLiberacao">Horário de Saída <span>*</span></label>
          <input type="time" id="horaLiberacao" min="07:30" max="17:00" required>
        </div>
      </div>

      <div class="campo">
        <label for="motivo">Motivo da Liberação <span>*</span></label>
        <select id="motivo" required>
          <option value="">Selecione o motivo</option>
          <option>Consulta Médica</option>
          <option>Compromisso Familiar</option>
          <option>Emergência</option>
          <option>Outro</option>
        </select>
      </div>

      <div class="campo">
        <label for="quemBusca">Quem irá buscar o estudante <span>*</span></label>
        <select id="quemBusca" required>
          <option value="">Selecione uma opção</option>
          <option value="Pai/Mãe">Pai/Mãe</option>
          <option value="Parente do Responsável">Parente do Responsável (Tio, Tia, etc.)</option>
          <option value="Motorista de Aplicativo">Motorista de Aplicativo</option>
          <option value="Outro">Outro</option>
        </select>
        <p class="aviso-quem-busca" id="avisoQuemBusca" style="display:none">Informe na descrição abaixo quem irá buscar o estudante.</p>
      </div>

      <div class="campo">
        <label for="observacoes" id="tituloObservacoesLiberacao">Observações Adicionais <span id="marcaOpcionalLiberacao">(Opcional)</span><span id="marcaObrigatoriaLiberacao" style="display:none">*</span></label>
        <textarea id="observacoes" placeholder="Adicione informações adicionais sobre a liberação..."></textarea>
      </div>

      <div class="info-box">
        <i class="fa-solid fa-circle-info"></i>
        <p>
          <strong>Informação Importante</strong><br>
          A liberação será enviada para aprovação da escola.
          Você receberá uma notificação quando for processada.
        </p>
      </div>

      <div class="buttons">
        <button type="button" class="cancel-btn" onclick="cancelarSolicitacao()">
          Cancelar
        </button>
        <button type="submit" class="submit-btn">
          <i class="fa-solid fa-paper-plane"></i>
          Solicitar Liberação
        </button>
      </div>

    </form>

  </main>

  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/header.js"></script>
  <script src="../../assets/js/liberar-estudante.js"></script>
</body>
</html>
