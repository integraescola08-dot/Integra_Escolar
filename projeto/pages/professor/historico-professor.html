<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" type="image/x-icon" href="../../assets/img/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/img/favicon-32.png">
  <script>window.PERFIL_ESPERADO = 'professor';</script>
  <script src="../../assets/js/guarda-sessao.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Integra Escolar | Histórico do Professor</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/paleta.css">
  <link rel="stylesheet" href="../../assets/css/header.css">
  <style>
    /* CSS de histórico.css é injetado via <link> logo abaixo, mas o
       cabeçalho da página (<header>) usa header.css/professor.css.
       Aqui só garantimos que o conteúdo do histórico fique com respiro
       abaixo do header fixo, igual às outras telas do professor. */
    body { padding-top: 0; }
  </style>
  <link rel="stylesheet" href="../../assets/css/historico.css">
</head>
<body>

  <header>
    <div class="logo">
      <img src="../../assets/img/LOGO-minimalista.png" alt="Logo">
    </div>
    <div class="top-content">
      <div class="user">
        <i class="fa-solid fa-chalkboard-user"></i>
        <span>Professor(a)</span>
      </div>
      <div class="menu" onclick="abrirMenu()">
        <i class="fa-solid fa-bars"></i>
      </div>
    </div>
    <div class="dropdown-menu" id="dropdownMenu">
      <div class="menu-item"><i class="fa-regular fa-user"></i><span>Meu Perfil</span></div>
      <div class="menu-item"><i class="fa-regular fa-clock"></i><span>Histórico</span></div>
      <div class="menu-item sair" onclick="sair()">
        <i class="fa-solid fa-right-from-bracket"></i><span>Sair</span>
      </div>
    </div>

    <nav class="quick-menu">
    <a href="controle-faltas.html"
       class="quick-item"
       onclick="ir('controle-faltas.html', this)">
        <i class="fa-solid fa-list-check"></i>
        <span>Controle de Faltas</span>
    </a>
    <a href="historico-professor.html"
       class="quick-item active"
       onclick="ir('historico-professor.html', this)">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span>Histórico</span>
    </a>
</nav>
  </header>

  <div class="page">
    <div class="card">
      <div class="card-header">
        <div class="card-header-top">
          <h2>Meu Histórico</h2>
        </div>
        <div class="tabs">
          <button class="tab-btn active" onclick="switchTab('faltas', this)">Faltas Lançadas</button>
          <button class="tab-btn" onclick="switchTab('atestados', this)">Atestados &amp; Liberações</button>
        </div>
      </div>

      <div class="search-bar">
        <div class="search-row">
          <div class="periodo-chips">
            <button class="chip active" data-periodo="todos" onclick="setPeriodo('todos', this)">Todos</button>
            <button class="chip" data-periodo="hoje" onclick="setPeriodo('hoje', this)">Hoje</button>
            <button class="chip" data-periodo="7dias" onclick="setPeriodo('7dias', this)">7 dias</button>
            <button class="chip" data-periodo="mes" onclick="setPeriodo('mes', this)">Este mês</button>
          </div>
        </div>
        <div class="search-row">
          <div class="data-field">
            <label>De</label>
            <input type="date" id="filtro-de" onchange="onDataManualAlterada()">
          </div>
          <div class="data-field">
            <label>Até</label>
            <input type="date" id="filtro-ate" onchange="onDataManualAlterada()">
          </div>
          <select class="filter-select" id="filtro-status" onchange="render()">
            <option value="">Todos os status</option>
            <option value="pendente">Pendente</option>
            <option value="aprovado">Aprovado</option>
            <option value="rejeitado">Rejeitado</option>
          </select>
        </div>
        <div class="result-count" id="result-count"></div>
      </div>

      <div class="list" id="list">
        <p style="text-align:center;color:var(--gray-500);padding:40px 0">Carregando...</p>
      </div>
    </div>
  </div>

  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/header.js"></script>
  <script src="../../assets/js/historico-professor.js"></script>
</body>
</html>
