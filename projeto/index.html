<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Integra Escolar | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/paleta.css">
  <link rel="stylesheet" href="assets/css/login.css">
</head>
<body>

  <div class="bg-gradient"></div>
  <div class="bg-light bg-light-1"></div>
  <div class="bg-light bg-light-2"></div>

  <main class="page">

    <!-- LOGO -->
    <header class="logo-container">
      <div class="logo-icon">
        <img src="assets/img/logo-tela-inicio.png" alt="Logo Integra Escolar">
      </div>
    </header>

    <!-- CARD -->
    <section class="login-card">
      <div class="card-border"></div>

      <div class="card-content">

        <p class="login-mini-title">LOGIN</p>

        <p class="login-subtitle">Entre com seu email e senha. O sistema identifica automaticamente seu perfil de acesso.</p>

        <h1 class="login-title" id="login-title">ACESSO AO SISTEMA</h1>

        <form id="loginForm">

          <!-- EMAIL -->
          <div class="input-group">
            <label for="email">Email</label>
            <div class="input-wrapper">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25H4.5a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5H4.5A2.25 2.25 0 0 0 2.25 6.75m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.909A2.25 2.25 0 0 1 2.25 6.993V6.75" />
              </svg>
              <input type="email" id="email" placeholder="Digite seu email" required>
            </div>
          </div>

          <!-- SENHA -->
          <div class="input-group">
            <label for="senha">Senha</label>
            <div class="input-wrapper">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 0h10.5A2.25 2.25 0 0 1 19.5 12.75v6A2.25 2.25 0 0 1 17.25 21h-10.5A2.25 2.25 0 0 1 4.5 18.75v-6A2.25 2.25 0 0 1 6.75 10.5Z" />
              </svg>
              <input type="password" id="senha" placeholder="Digite sua senha" required>
              <button type="button" class="toggle-password" id="togglePassword">
                <img src="assets/img/OLHO-FECHADO.png" id="eyeIcon" alt="Mostrar senha">
              </button>
            </div>
          </div>

          <!-- BOTÃO -->
          <button type="submit" class="login-button">
            <span>CONTINUAR</span>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
              stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="m4.5 12 13.5 0m0 0-5.25-5.25M18 12l-5.25 5.25" />
            </svg>
          </button>

        </form>

        <p class="voltar-login">Ainda não tem cadastro? <a href="cadastro.html">Cadastre-se como responsável</a></p>
      </div>
    </section>

  </main>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <script src="assets/js/api.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
